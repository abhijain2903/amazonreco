<div style="position:fixed;inset:0;z-index:44" data-close="pop"></div>
<div class="pop" role="dialog" aria-label="Notifications"><div class="pop-h"><b>Notifications</b><span class="spacer"></span><button type="button" class="btn sm ghost" hx-post="/notifications/scope/" hx-target="#pop" title="Switch between alerts for your work and everything">{% if scope == 'all' %}Showing everything{% else %}Showing my work{% endif %}</button><button type="button" class="btn sm ghost" hx-post="/notifications/read-all/" hx-target="#pop">Mark all read</button></div>
<div class="pop-l">{% for n in items %}<button type="button" class="pop-i {{ n.tone }}" hx-get="/notifications/{{ n.pk }}/" hx-swap="none" data-close="pop" style="{% if n.seen %}opacity:.65{% endif %}"><i></i><span>{{ n.text }}<small>{{ n.at|ago }}</small></span></button>{% empty %}<div class="empty">No notifications</div>{% endfor %}</div></div>
