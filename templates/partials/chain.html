<div class="chain">{% for c in chain %}{% if not forloop.first %}{% icon 'chev' %}{% endif %}{% if c.v %}<button type="button" class="lk" {% if c.tab %}hx-get="{{ base }}?tab={{ c.tab }}" hx-target="#drawer"{% else %}style="cursor:default"{% endif %}><span>{{ c.l }}</span><b>{{ c.v }}</b></button>{% else %}<span class="lk none"><span>{{ c.l }}</span><b>pending</b></span>{% endif %}{% endfor %}</div>
