{% regroup res by g as groups %}{% for grp in groups %}<div class="pal-g">{{ grp.grouper }}</div>{% for r in grp.list %}{% if r.nav %}<a class="pal-i {% if forloop.parentloop.first and forloop.first %}on{% endif %}" href="{{ r.url }}" data-close="pal" style="text-decoration:none;color:inherit">{% icon r.icon %}<span>{{ r.label }}</span></a>{% else %}<button type="button" class="pal-i {% if forloop.parentloop.first and forloop.first %}on{% endif %}" hx-get="{{ r.url }}" hx-target="#drawer" data-close="pal">{% icon r.icon %}<span>{{ r.label }}</span><span class="sub">{{ r.sub }}</span></button>{% endif %}{% endfor %}{% empty %}<div class="empty"><b>No matches</b><span>Try a PO number, agreement #, DN, invoice or model.</span></div>{% endfor %}
